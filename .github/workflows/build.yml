# Builds the Windows installer on every push.
# Pushing a version tag (e.g. v1.2.0) also publishes a GitHub Release with
# ScrollShot-Setup.exe attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Stitching tests
        run: python test_stitch.py

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build ScrollShot.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name ScrollShot
          --icon icon.ico --add-data "icon.png;."
          --hidden-import pystray._win32
          --hidden-import pynput.mouse._win32 --hidden-import pynput.keyboard._win32
          scrollshot.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollShot-Setup
          path: Output/ScrollShot-Setup.exe
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/ScrollShot-Setup.exe
          generate_release_notes: true
