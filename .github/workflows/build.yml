# Builds the Windows installer on every push and pull request.
# On main, when the VERSION in installer.nsi has no release yet, it also
# publishes a GitHub Release (tag vVERSION) with ScrollShot-Setup.exe attached.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Stitching tests
        run: python test_stitch.py

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build ScrollShot.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name ScrollShot
          --icon icon.ico --add-data "icon.png;."
          --hidden-import pystray._win32
          --hidden-import pynput.mouse._win32 --hidden-import pynput.keyboard._win32
          scrollshot.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollShot-Setup
          path: Output/ScrollShot-Setup.exe
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path installer.nsi -Pattern '!define VERSION "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Check for an existing release
        id: existing
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" *> $null
          "exists=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.existing.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ScrollShot ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Output/ScrollShot-Setup.exe
          generate_release_notes: true
